services:
  engramvault-web:
    build: .
    image: engramvault-web:latest
    container_name: engramvault-web
    restart: unless-stopped
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./data:/data
      - .:/app/public:ro
      - ./server.py:/app/server.py:ro
    networks:
      - services_net

networks:
  services_net:
    external: true
